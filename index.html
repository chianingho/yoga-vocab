<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoga & Daily Vocab Pro</title>
    
    <script>
        // 桌面可愛 Icon 繪製邏輯
        (function() {
            const canvas = document.createElement('canvas');
            canvas.width = 180; canvas.height = 180;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#FFE4E1'; 
            ctx.beginPath();
            ctx.roundRect ? ctx.roundRect(0, 0, 180, 180, 40) : ctx.rect(0, 0, 180, 180);
            ctx.fill();
            ctx.font = '30px serif'; ctx.fillText('✨', 20, 45);
            ctx.font = '105px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('🧘‍♀️', 90, 105);
            const pngDataUrl = canvas.toDataURL('image/png');
            const linkIcon = document.createElement('link');
            linkIcon.rel = 'icon'; linkIcon.type = 'image/png'; linkIcon.href = pngDataUrl;
            document.head.appendChild(linkIcon);
            const linkApple = document.createElement('link');
            linkApple.rel = 'apple-touch-icon'; linkApple.href = pngDataUrl;
            document.head.appendChild(linkApple);
        })();
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .animate-pop { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: scale(0.9); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans selection:bg-indigo-100">

    <main class="flex-grow p-4 max-w-md mx-auto w-full flex flex-col justify-start">

            <button onclick="selectMode('yoga')" class="group relative bg-white border-2 border-indigo-100 p-8 rounded-3xl shadow-xl hover:shadow-2xl transition-all active:scale-95 overflow-hidden">

                    <span class="text-indigo-600 font-bold tracking-widest text-lg">專業瑜珈解剖 (100+)</span>
                </div>
            </button>
            <button onclick="selectMode('daily')" class="group relative bg-white border-2 border-emerald-100 p-8 rounded-3xl shadow-xl hover:shadow-2xl transition-all active:scale-95 overflow-hidden">
                <div class="absolute right-[-10px] top-[-10px] text-6xl opacity-10 group-hover:rotate-12 transition-transform">🏠</div>
                <div class="text-left">
                    <span class="block text-3xl mb-1">日常生活</span>
                    <span class="text-emerald-600 font-bold tracking-widest text-lg">A2-B1 實用單字 (100)</span>
                </div>
            </button>
        </div>

        <div id="preview-screen" class="hidden bg-white rounded-3xl p-6 shadow-xl w-full animate-pop">
            <h2 class="text-xl font-black text-slate-800 mb-2 text-center">📖 本輪預習清單</h2>
            <p class="text-sm text-slate-400 text-center mb-4 italic">點擊英文可聽發音</p>
            <div id="preview-list" class="space-y-3 max-h-[50vh] overflow-y-auto pr-2 hide-scroll"></div>
            <div class="grid grid-cols-2 gap-3 mt-6">
                <button onclick="showScreen('menu-screen')" class="bg-slate-100 text-slate-600 font-bold py-4 rounded-2xl">返回選單</button>
                <button onclick="startGame()" class="bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-lg shadow-indigo-200 tracking-widest text-lg">開始挑戰</button>
            </div>
        </div>

        <div id="game-screen" class="hidden w-full">
            <div class="flex justify-between items-center mb-4 px-2">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Left: English</span>
                <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Right: 中文</span>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div id="english-col" class="flex flex-col gap-3"></div>
                <div id="chinese-col" class="flex flex-col gap-3"></div>
            </div>
        </div>

        <div id="win-message" class="hidden text-center py-10 bg-white rounded-3xl shadow-2xl p-8 animate-pop">
            <div class="text-6xl mb-4">🏆</div>
            <h2 class="text-3xl font-black text-emerald-600 mb-2">配對成功！</h2>
            <p class="text-slate-500 mb-8">這 10 個單字你已經掌握囉！</p>
            <div class="space-y-3">
                <button onclick="initRound()" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-lg text-xl tracking-widest">再玩 10 個</button>
                <button onclick="showScreen('menu-screen')" class="w-full bg-slate-100 text-slate-500 font-bold py-4 rounded-2xl">回到主選單</button>
            </div>
        </div>
    </main>

    <footer id="game-footer" class="hidden p-4 max-w-md mx-auto w-full sticky bottom-0 bg-slate-100/80 backdrop-blur-md">
        <div class="grid grid-cols-2 gap-4">
            <button onclick="showScreen('menu-screen')" class="bg-white border-2 border-slate-200 text-slate-500 font-bold py-3 rounded-xl shadow-sm text-sm">↩️ 返回主頁</button>
            <button onclick="initRound()" class="bg-slate-800 text-white font-bold py-3 rounded-xl shadow-sm text-sm">🔄 換一組字</button>
        </div>
    </footer>

                { en: 'Regularly', zh: '規律地' }, { en: 'Comfortable', zh: '舒服的' }, { en: 'Expensive', zh: '昂貴的' },
                { en: 'Flexible', zh: '有彈性的' }, { en: 'Reliable', zh: '可靠的' }, { en: 'Responsible', zh: '負責任的' },
                { en: 'Immediate', zh: '立即的' }, { en: 'Sufficient', zh: '充足的' }, { en: 'Excellent', zh: '優秀的' },
                { en: 'Incredible', zh: '不可思議的' }, { en: 'Satisfied', zh: '滿意的' }, { en: 'Concentrate', zh: '集中精神' },
                { en: 'Encourage', zh: '鼓勵' }, { en: 'Recognize', zh: '辨認/承認' }, { en: 'Organize', zh: '組織/整理' },
                { en: 'Participate', zh: '參加' }, { en: 'Translate', zh: '翻譯' }, { en: 'Adventure', zh: '冒險' },
                { en: 'Background', zh: '背景' }, { en: 'Budget', zh: '預算' }, { en: 'Collection', zh: '收藏' },
                { en: 'Description', zh: '描述' }, { en: 'Environment', zh: '環境' }, { en: 'Equipment', zh: '設備' },
                { en: 'Instruction', zh: '指示' }, { en: 'Knowledge', zh: '知識' }, { en: 'Performance', zh: '表現' },
                { en: 'Quality', zh: '品質' }, { en: 'Service', zh: '服務' }, { en: 'Strategy', zh: '策略' }
            ]
        };

        let currentMode = 'yoga';
        let currentRoundData = [];
        let selectedEngCard = null;
        let selectedZhCard = null;
        let matchedCount = 0;

        function showScreen(screenId) {
            ['menu-screen', 'preview-screen', 'game-screen', 'win-message'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
            document.getElementById('game-footer').classList.toggle('hidden', screenId !== 'game-screen' && screenId !== 'preview-screen');
        }

        function selectMode(mode) {
            currentMode = mode;
            document.getElementById('header-title').innerText = mode === 'yoga' ? '🧘‍♀️ 瑜珈解剖單字' : '🏠 日常生活單字';
            initRound();
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.8;
                window.speechSynthesis.speak(utterance);
            }
        }

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function initRound() {
            selectedEngCard = null; selectedZhCard = null; matchedCount = 0;
            currentRoundData = shuffle([...allVocab[currentMode]]).slice(0, 10);
            
            const previewList = document.getElementById('preview-list');
            previewList.innerHTML = '';
            currentRoundData.forEach(item => {
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between bg-white border border-slate-200 p-4 rounded-2xl cursor-pointer active:bg-indigo-50 transition shadow-sm';
                row.onclick = () => speak(item.en);
                row.innerHTML = `<span class="text-lg font-bold text-indigo-900">${item.en}</span><span class="text-lg text-slate-500">${item.zh}</span>`;
                previewList.appendChild(row);
            });
            showScreen('preview-screen');
        }

        function startGame() {
            showScreen('game-screen');
            const engCol = document.getElementById('english-col');
            const zhCol = document.getElementById('chinese-col');
            engCol.innerHTML = ''; zhCol.innerHTML = '';

            let engCards = shuffle(currentRoundData.map(i => ({ id: i.en, text: i.en, type: 'en' })));
            let zhCards = shuffle(currentRoundData.map(i => ({ id: i.en, text: i.zh, type: 'zh' })));

            const createCard = (card, container) => {
                const el = document.createElement('div');
                el.className = 'bg-white border-2 border-slate-200 rounded-2xl p-4 min-h-[85px] flex items-center justify-center text-center font-black text-xl shadow-md transition active:scale-95 leading-tight select-none';
                el.innerText = card.text;
                el.onclick = () => handleCardClick(el, card);
                container.appendChild(el);
            };

            engCards.forEach(c => createCard(c, engCol));
            zhCards.forEach(c => createCard(c, zhCol));
        }

        function handleCardClick(element, card) {
            if (element.classList.contains('pointer-events-none')) return;

            if (card.type === 'en') {
                speak(card.text);
                if (selectedEngCard) selectedEngCard.el.classList.replace('border-indigo-600', 'border-slate-200');
                selectedEngCard = { el: element, id: card.id };
                element.classList.replace('border-slate-200', 'border-indigo-600');
            } else {
                if (selectedZhCard) selectedZhCard.el.classList.replace('border-indigo-600', 'border-slate-200');
                selectedZhCard = { el: element, id: card.id };
                element.classList.replace('border-slate-200', 'border-indigo-600');
            }

            if (selectedEngCard && selectedZhCard) {
                const eEl = selectedEngCard.el; const zEl = selectedZhCard.el;
                document.getElementById('game-screen').classList.add('pointer-events-none');

                if (selectedEngCard.id === selectedZhCard.id) {
                    [eEl, zEl].forEach(el => el.className = 'bg-emerald-500 border-emerald-600 text-white rounded-2xl p-4 min-h-[85px] flex items-center justify-center text-center font-black text-xl shadow-lg transition duration-200 animate-pop');
                    matchedCount++; selectedEngCard = null; selectedZhCard = null;
                    setTimeout(() => {
                        [eEl, zEl].forEach(el => el.classList.add('opacity-0', 'pointer-events-none'));
                        document.getElementById('game-screen').classList.remove('pointer-events-none');
                        if (matchedCount === 10) showScreen('win-message');
                    }, 800);
                } else {
                    [eEl, zEl].forEach(el => el.className = 'bg-rose-500 border-rose-600 text-white rounded-2xl p-4 min-h-[85px] flex items-center justify-center text-center font-black text-xl shadow-lg transition duration-200');
                    setTimeout(() => {
                        eEl.className = 'bg-white border-2 border-slate-200 rounded-2xl p-4 min-h-[85px] flex items-center justify-center text-center font-black text-xl shadow-md transition active:scale-95 leading-tight';
                        zEl.className = 'bg-white border-2 border-slate-200 rounded-2xl p-4 min-h-[85px] flex items-center justify-center text-center font-black text-xl shadow-md transition active:scale-95 leading-tight';
                        selectedEngCard = null; selectedZhCard = null;
                        document.getElementById('game-screen').classList.remove('pointer-events-none');
                    }, 800);
                }
            }
        }
        showScreen('menu-screen');
    </script>
</body>
</html>
