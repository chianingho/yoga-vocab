<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoga Vocab Master</title>
    
    <!-- 桌面可愛明亮 Icon 設定 (支援 iOS & Android) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23FFE4E1'/><text x='50' y='68' font-size='52' text-anchor='middle'>🧘‍♀️</text><text x='22' y='32' font-size='20'>✨</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23FFE4E1'/><text x='50' y='68' font-size='52' text-anchor='middle'>🧘‍♀️</text><text x='22' y='32' font-size='20'>✨</text></svg>">
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 避免手機瀏覽器點擊卡片時出現藍色外框 */
        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between font-sans selection:bg-indigo-100">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 py-4 px-6 text-center sticky top-0 z-50 shadow-sm">
        <h1 class="text-xl font-bold text-slate-800 tracking-wide">🧘‍♀️ 全英瑜珈師資班單字庫</h1>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow p-4 max-w-md mx-auto w-full flex flex-col justify-center">
        
        <!-- 階段一：10個單字介紹卡片 (預習畫面) -->
        <div id="preview-screen" class="bg-white rounded-2xl p-5 shadow-md w-full">
            <h2 class="text-lg font-bold text-slate-800 mb-2 text-center">📖 本輪單字預習 (10個單字)</h2>
            <p class="text-xs text-slate-500 text-center mb-4">點擊下方任意單字可聽發音，準備好就開始挑戰！</p>
            
            <div id="preview-list" class="space-y-2.5 max-h-[55vh] overflow-y-auto pr-1">
                <!-- 由 JS 動態生成預習清單 -->
            </div>
            
            <button onclick="startGame()" class="w-full mt-5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-md transition text-lg tracking-wider active:scale-[0.98]">
                開始遊戲
            </button>
        </div>

        <!-- 階段二：遊戲配對畫面 -->
        <div id="game-screen" class="hidden w-full">
            <p class="text-xs text-slate-500 text-center mb-3">左邊選英文，右邊選中文</p>
            <div class="grid grid-cols-2 gap-4">
                <!-- 左邊：英文欄 -->
                <div id="english-col" class="flex flex-col gap-3"></div>
                <!-- 右邊：中文欄 -->
                <div id="chinese-col" class="flex flex-col gap-3"></div>
            </div>
        </div>

        <!-- 階段三：破關提示 -->
        <div id="win-message" class="hidden text-center py-8 bg-white rounded-2xl shadow-md p-6 animate-fade-in">
            <h2 class="text-2xl font-bold text-emerald-600 mb-2">🎉 太棒了！全部配對成功</h2>
            <p class="text-sm text-slate-500 mb-4">這 10 個單字你已經有概念囉！</p>
            <button onclick="initRound()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-md transition">
                挑戰下一組單字
            </button>
        </div>
    </main>

    <!-- Footer / Reset Button -->
    <footer id="game-footer" class="hidden p-4 max-w-md mx-auto w-full sticky bottom-0 bg-slate-100/80 backdrop-blur-md">
        <button onclick="initRound()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-3 rounded-xl shadow-sm transition text-center text-sm">
            重新挑選單字 / 放棄本局
        </button>
    </footer>

    <script>
        const vocabData = [
            { en: 'Inhale', zh: '吸氣' }, { en: 'Exhale', zh: '吐氣' }, { en: 'Lengthen', zh: '延伸 / 拉長' },
            { en: 'Engage', zh: '啟動 / 收緊肌肉' }, { en: 'Root down', zh: '向下扎根' }, { en: 'Ground down', zh: '穩固於地面' },
            { en: 'Micro-bend', zh: '微彎 (膝/肘)' }, { en: 'Tuck the tailbone', zh: '捲尾骨 / 內收' }, { en: 'Draw navel to spine', zh: '肚臍收向脊椎' },
            { en: 'Knit the ribs in', zh: '肋骨內收不外翻' }, { en: 'Stack your joints', zh: '關節垂直對齊' }, { en: 'Square your hips', zh: '骨盆擺正' },
            { en: 'Soften', zh: '放鬆 / 柔和' }, { en: 'Melt', zh: '下沉 / 融化' }, { en: 'Internal rotation', zh: '內旋' },
            { en: 'External rotation', zh: '外旋' }, { en: 'Flex the feet', zh: '勾腳背' }, { en: 'Point the toes', zh: '壓腳背 / 繃腳尖' },
            { en: 'Gaze / Drishti', zh: '凝視點 / 眼神專注' }, { en: 'Lift / Elevate', zh: '抬起 / 提升' }, { en: 'Press / Push', zh: '推 / 壓' },
            { en: 'Reach', zh: '向外延伸' }, { en: 'Expand', zh: '擴展 (胸腔)' }, { en: 'Release', zh: '釋放 / 解開動作' },
            { en: 'Forearm', zh: '小臂 / 前臂' }, { en: 'Thumb', zh: '大拇指' }, { en: 'Wrist', zh: '手腕' },
            { en: 'Palm', zh: '手掌' }, { en: 'Crown of the head', zh: '頭頂' }, { en: 'Collarbone', zh: '鎖骨' },
            { en: 'Shoulder blades', zh: '肩胛骨' }, { en: 'Rib cage', zh: '肋骨 / 胸廓' }, { en: 'Spine', zh: '脊椎' },
            { en: 'Tailbone', zh: '尾骨' }, { en: 'Sacrum', zh: '薦骨 / 骶骨' }, { en: 'Sit bones', zh: '坐骨' },
            { en: 'Pelvis', zh: '骨盆' }, { en: 'Torso', zh: '軀幹' }, { en: 'Sternum', zh: '胸骨' },
            { en: 'Thigh', zh: '大腿' }, { en: 'Shin', zh: '小腿前側 / 脛骨' }, { en: 'Calf', zh: '小腿肚' },
            { en: 'Heel', zh: '腳跟' }, { en: 'Ankle', zh: '腳踝' }, { en: 'Core', zh: '核心肌群' },
            { en: 'Hamstrings', zh: '大腿後側肌群' }, { en: 'Quadriceps', zh: '大腿前側四頭肌' }, { en: 'Glutes', zh: '臀部肌群' },
            { en: 'Pelvic floor', zh: '盆底肌' }, { en: 'Psoas', zh: '髂腰肌' }, { en: 'Downward-Facing Dog', zh: '下犬式' },
            { en: 'Upward-Facing Dog', zh: '上犬式' }, { en: 'Warrior Pose', zh: '戰士式' }, { en: 'Child’s Pose', zh: '嬰兒式' },
            { en: 'Plank Pose', zh: '平板式' }, { en: 'Cobra Pose', zh: '眼鏡蛇式' }, { en: 'Mountain Pose', zh: '山式' },
            { en: 'Corpse Pose / Savasana', zh: '大休息' }, { en: 'Forward Fold', zh: '前彎' }, { en: 'Halfway Lift', zh: '半前彎 / 脊椎延伸' },
            { en: 'Chairs Pose', zh: '幻椅式' }, { en: 'Chaturanga', zh: '四柱支撐' }, { en: 'Pranayama', zh: '呼吸法 / 調息' },
            { en: 'Asana', zh: '體位法' }, { en: 'Vinyasa', zh: '動態串聯' }, { en: 'Alignment', zh: '正位 / 對位' },
            { en: 'Modification', zh: '退階動作' }, { en: 'Progression', zh: '進階動作' }, { en: 'Props', zh: '輔具 (磚/繩)' },
            { en: 'Mat', zh: '瑜珈墊' }
        ];

        let currentRoundData = [];
        let selectedEngCard = null;
        let selectedZhCard = null;
        let matchedCount = 0;

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85; 
                window.speechSynthesis.speak(utterance);
            }
        }

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function initRound() {
            document.getElementById('preview-screen').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('game-footer').classList.add('hidden');
            document.getElementById('win-message').classList.add('hidden');
            
            selectedEngCard = null;
            selectedZhCard = null;
            matchedCount = 0;

            currentRoundData = shuffle([...vocabData]).slice(0, 10);

            const previewList = document.getElementById('preview-list');
            previewList.innerHTML = '';
            currentRoundData.forEach(item => {
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between bg-slate-50 border border-slate-200 p-3 rounded-xl cursor-pointer active:bg-indigo-50 transition shadow-sm';
                row.onclick = () => speak(item.en);
                row.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span class="text-base font-bold text-indigo-900">${item.en}</span>
                        <span class="text-xs text-slate-400">🔊</span>
                    </div>
                    <span class="text-base font-medium text-slate-600">${item.zh}</span>
                `;
                previewList.appendChild(row);
            });
        }

        function startGame() {
            document.getElementById('preview-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('game-footer').classList.remove('hidden');

            const engCol = document.getElementById('english-col');
            const zhCol = document.getElementById('chinese-col');
            engCol.innerHTML = '';
            zhCol.innerHTML = '';

            let engCards = currentRoundData.map(item => ({ id: item.en, text: item.en, type: 'en' }));
            let zhCards = currentRoundData.map(item => ({ id: item.en, text: item.zh, type: 'zh' }));
            shuffle(engCards);
            shuffle(zhCards);

            engCards.forEach(card => {
                const el = document.createElement('div');
                el.className = 'bg-white border-2 border-slate-200 rounded-xl p-3 h-20 flex items-center justify-center text-center font-bold text-xl text-indigo-950 shadow-sm cursor-pointer transition active:scale-95 leading-tight';
                el.innerText = card.text;
                el.onclick = () => handleCardClick(el, card);
                engCol.appendChild(el);
            });

            zhCards.forEach(card => {
                const el = document.createElement('div');
                el.className = 'bg-white border-2 border-slate-200 rounded-xl p-3 h-20 flex items-center justify-center text-center font-bold text-xl text-slate-800 shadow-sm cursor-pointer transition active:scale-95 leading-tight';
                el.innerText = card.text;
                el.onclick = () => handleCardClick(el, card);
                zhCol.appendChild(el);
            });
        }

        function handleCardClick(element, card) {
            if (element.classList.contains('pointer-events-none')) return;

            if (card.type === 'en') {
                speak(card.text);
                if (selectedEngCard) {
                    selectedEngCard.el.classList.remove('border-indigo-600', 'bg-indigo-50', 'text-indigo-700');
                }
                selectedEngCard = { el: element, id: card.id };
                element.classList.add('border-indigo-600', 'bg-indigo-50', 'text-indigo-700');
            } else {
                if (selectedZhCard) {
                    selectedZhCard.el.classList.remove('border-indigo-600', 'bg-indigo-50', 'text-indigo-700');
                }
                selectedZhCard = { el: element, id: card.id };
                element.classList.add('border-indigo-600', 'bg-indigo-50', 'text-indigo-700');
            }

            if (selectedEngCard && selectedZhCard) {
                const eEl = selectedEngCard.el;
                const zEl = selectedZhCard.el;

                document.getElementById('game-screen').classList.add('pointer-events-none');

                if (selectedEngCard.id === selectedZhCard.id) {
                    [eEl, zEl].forEach(el => {
                        el.className = 'bg-emerald-500 border-emerald-600 text-white rounded-xl p-3 h-20 flex items-center justify-center text-center font-bold text-xl shadow-md transition duration-200';
                    });

                    matchedCount++;
                    selectedEngCard = null;
                    selectedZhCard = null;

                    setTimeout(() => {
                        [eEl, zEl].forEach(el => {
                            el.className = 'opacity-0 pointer-events-none rounded-xl p-3 h-20 flex items-center justify-center text-center transition duration-300';
                        });
                        document.getElementById('game-screen').classList.remove('pointer-events-none');

                        if (matchedCount === 10) {
                            setTimeout(() => {
                                document.getElementById('game-screen').classList.add('hidden');
                                document.getElementById('game-footer').classList.add('hidden');
                                document.getElementById('win-message').classList.remove('hidden');
                            }, 300);
                        }
                    }, 800);

                } else {
                    [eEl, zEl].forEach(el => {
                        el.className = 'bg-rose-500 border-rose-600 text-white rounded-xl p-3 h-20 flex items-center justify-center text-center font-bold text-xl shadow-md transition duration-200';
                    });

                    setTimeout(() => {
                        eEl.className = 'bg-white border-2 border-slate-200 rounded-xl p-3 h-20 flex items-center justify-center text-center font-bold text-xl text-indigo-950 shadow-sm cursor-pointer transition active:scale-95 leading-tight';
                        zEl.className = 'bg-white border-2 border-slate-200 rounded-xl p-3 h-20 flex items-center justify-center text-center font-bold text-xl text-slate-800 shadow-sm cursor-pointer transition active:scale-95 leading-tight';
                        
                        selectedEngCard = null;
                        selectedZhCard = null;
                        document.getElementById('game-screen').classList.remove('pointer-events-none');
                    }, 800);
                }
            }
        }

        initRound();
    </script>
</body>
</html>
